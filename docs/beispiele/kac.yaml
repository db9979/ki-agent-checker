# Beispiel für `kac-engine scan --config kac.yaml` und die GitHub Action.
# Geheimnisse nie hier eintragen, sondern als ${NAME} aus der Umgebung holen.
fail_on: high            # info, low, medium, high, critical oder never

project:
  name: Mein MCP-Server
  scope: [mcp.example.com]
  authorization_confirmed: true   # Pflicht: Du darfst dieses System testen
  authorized_by: Max Mustermann

target:
  name: mein-server
  kind: mcp               # model, openai_endpoint, http, mcp oder mcp_tool
  url: https://mcp.example.com/mcp
  mcp_tool_calls: readonly
  auth:
    kind: bearer
  accounts:
    - name: ci
      token: ${MCP_TOKEN}

# Für kind: mcp_tool (ein Tool als Chat-Ziel):
#   mcp_tool: frage_stellen

# Optional: eigene Modelle, z. B. als Richter
# providers:
#   - name: richter
#     kind: openai_compatible
#     model: qwen2.5:14b
#     base_url: http://localhost:11434/v1
#     api_key: ${RICHTER_KEY}

run:
