name: Desktop-Build

# Baut Installer für Windows, macOS und Linux.
# Läuft bei Pushes auf main, bei Tags (v*, dann auch als GitHub Release) und manuell, nicht bei jedem PR,
# weil macOS- und Windows-Minuten auf GitHub teurer sind.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-22.04
          # ARM64, z. B. ClockworkPi uConsole (CM4/CM5) mit Raspberry Pi OS oder Debian bookworm.
          # Gebaut auf Ubuntu 22.04 (glibc 2.35), damit es auf bookworm (glibc 2.36) läuft.
          - name: Linux (ARM64, uConsole)
            os: ubuntu-22.04-arm
          - name: Windows (x64)
            os: windows-latest
          # Windows auf ARM, z. B. Snapdragon-Notebooks. Läuft nativ statt in der x64-Emulation.
          - name: Windows (ARM64)
            os: windows-11-arm
          - name: macOS (Apple Silicon)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Engine als Sidecar bauen
        run: |
          uv sync --project engine
          uv run --project engine python scripts/build_sidecar.py

      - name: Desktop-App bauen
        working-directory: app
        shell: bash
        run: |
          npm ci
          if [ "$RUNNER_OS" = "Linux" ]; then
            # .deb für Raspberry Pi OS/Debian, AppImage für andere Distributionen
            npx tauri build --config src-tauri/tauri.release.conf.json --bundles deb,appimage
          else
            npx tauri build --config src-tauri/tauri.release.conf.json
          fi

      # Startet die Engine aus dem fertigen Paket. Fängt z. B. Signaturprobleme ab,
      # bei denen macOS das eingebettete Python nicht laden lässt.
      - name: Engine im Paket starten (Smoke-Test)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) BIN="$(ls -d app/src-tauri/target/release/bundle/macos/*.app)/Contents/MacOS/kac-engine" ;;
            Windows) BIN="app/src-tauri/target/release/kac-engine.exe" ;;
            *) BIN="app/src-tauri/target/release/kac-engine" ;;
          esac
          "$BIN" serve --no-auth --port 8799 --data-dir "$RUNNER_TEMP/kac" > engine.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8799/health; then echo; echo "Engine läuft"; exit 0; fi
            sleep 2
          done
          echo "Engine startet nicht:"; cat engine.log; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ki-agent-checker-${{ matrix.os }}-${{ runner.arch }}
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn

  # Bei einem Tag v* (z. B. v0.1.0) landen alle Installer als GitHub Release.
  release:
    name: Release veröffentlichen
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen
        run: |
          APP=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$APP" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur App-Version $APP (app/src-tauri/tauri.conf.json)"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) > files.txt
          cat files.txt
          cat > notes.md <<'NOTES'
          ## Download

          | System | Datei |
          |---|---|
          | Windows (x64) | `…_x64-setup.exe` oder `…_x64_en-US.msi` |
          | Windows (ARM64) | `…_arm64-setup.exe` oder `…_arm64_en-US.msi` |
          | macOS (Apple Silicon) | `…_aarch64.dmg` |
          | Linux (x64) | `…_amd64.deb` oder `…_amd64.AppImage` |
          | Linux (ARM64, z. B. uConsole) | `…_arm64.deb` oder `…_aarch64.AppImage` |

          Die Installer sind nicht signiert. Windows SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“. macOS: beim ersten Start unter Systemeinstellungen → Datenschutz & Sicherheit auf „Dennoch öffnen“ klicken.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" --title "KI-Agent-Checker $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes $(cat files.txt)
