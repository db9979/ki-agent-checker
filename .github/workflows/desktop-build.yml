name: Desktop-Build

# Baut Installer für Windows, macOS und Linux.
# Läuft bei Pushes auf main, bei Tags (v*) und manuell, nicht bei jedem PR,
# weil macOS- und Windows-Minuten auf GitHub teurer sind.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-22.04
          # ARM64, z. B. ClockworkPi uConsole (CM4/CM5) mit Raspberry Pi OS oder Debian bookworm.
          # Gebaut auf Ubuntu 22.04 (glibc 2.35), damit es auf bookworm (glibc 2.36) läuft.
          - name: Linux (ARM64, uConsole)
            os: ubuntu-22.04-arm
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Engine als Sidecar bauen
        run: |
          uv sync --project engine
          uv run --project engine python scripts/build_sidecar.py

      - name: Desktop-App bauen
        working-directory: app
        shell: bash
        run: |
          npm ci
          if [ "$RUNNER_OS" = "Linux" ]; then
            # .deb für Raspberry Pi OS/Debian, AppImage für andere Distributionen
            npx tauri build --config src-tauri/tauri.release.conf.json --bundles deb,appimage
          else
            npx tauri build --config src-tauri/tauri.release.conf.json
          fi

      # Startet die Engine aus dem fertigen Paket. Fängt z. B. Signaturprobleme ab,
      # bei denen macOS das eingebettete Python nicht laden lässt.
      - name: Engine im Paket starten (Smoke-Test)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) BIN="$(ls -d app/src-tauri/target/release/bundle/macos/*.app)/Contents/MacOS/kac-engine" ;;
            Windows) BIN="app/src-tauri/target/release/kac-engine.exe" ;;
            *) BIN="app/src-tauri/target/release/kac-engine" ;;
          esac
          "$BIN" serve --no-auth --port 8799 --data-dir "$RUNNER_TEMP/kac" > engine.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8799/health; then echo; echo "Engine läuft"; exit 0; fi
            sleep 2
          done
          echo "Engine startet nicht:"; cat engine.log; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ki-agent-checker-${{ matrix.os }}-${{ runner.arch }}
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
